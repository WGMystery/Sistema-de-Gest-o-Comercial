<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>Comercial • Gestão inteligente</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-mark">C</div><div><strong>Comercial</strong><small>GESTÃO INTELIGENTE</small></div></div>
 <div class="nav-label">Menu principal</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="inicio"><span class="ico">▦</span>Visão geral</button>
  <button data-page="produtos"><span class="ico">▣</span>Produtos</button>
  <button data-page="vendas"><span class="ico">↗</span>Vendas</button>
  <button data-page="estoque"><span class="ico">▤</span>Estoque</button>
  <button data-page="pedidos"><span class="ico">▧</span>Pedidos</button>
  <button data-page="relatorios"><span class="ico">▥</span>Relatórios</button>
 </nav>
 <div class="side-foot">Sistema de Gestão Comercial<br>Organização para crescer.</div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb"><button class="mobile-menu" id="menuBtn" aria-label="Abrir menu">☰</button><span id="breadcrumb">Visão geral</span></div><div class="top-actions" role="group" aria-label="Opções de acessibilidade"><span class="a11y-label">Acessibilidade</span><button type="button" class="a11y-btn" id="fontDown" aria-label="Diminuir tamanho do texto" title="Diminuir texto">A−</button><button type="button" class="a11y-btn" id="fontUp" aria-label="Aumentar tamanho do texto" title="Aumentar texto">A+</button><button type="button" class="a11y-btn contrast-btn" id="contrastToggle" aria-pressed="false">Alto contraste</button></div><div class="profile"><div class="avatar">A</div><span>Administrador</span></div></header>
 <section class="content" id="content"></section>
</main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Novo produto</h2><button class="close" id="closeModal">×</button></div><form id="itemForm"><div class="form-grid" id="formFields"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancelModal">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div></div>
<script>
const $=s=>document.querySelector(s);
const load=(k)=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return []}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let products=load('sc_products'),sales=load('sc_sales'),orders=load('sc_orders'),page='inicio',editing=null,formType='product';
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const date=()=>new Date().toLocaleDateString('pt-BR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#breadcrumb').textContent=({inicio:'Visão geral',produtos:'Produtos',vendas:'Vendas',estoque:'Estoque',pedidos:'Pedidos',relatorios:'Relatórios'})[p];$('#sidebar').classList.remove('open');render()}
function head(k,t,d,btn=''){return '<div class="page-head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div>'+btn+'</div>'}
function stat(label,value,sub,icon){return '<div class="stat"><div class="stat-top">'+label+'<span class="stat-icon">'+icon+'</span></div><strong>'+value+'</strong><small>'+sub+'</small></div>'}
function table(headers,rows,empty){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows||'')+'</tbody></table>'+(rows?'':'<div class="empty">'+empty+'</div>')+'</div>'}
function productRows(list){return list.map(p=>'<tr><td><strong>'+esc(p.name)+'</strong><br><small class="muted">'+esc(p.category||'Sem categoria')+'</small></td><td>'+money(p.price)+'</td><td>'+p.stock+'</td><td><span class="pill '+(p.stock<=5?'low':'ok')+'">'+(p.stock<=5?'Estoque baixo':'Disponível')+'</span></td><td><div class="actions"><button class="icon-btn" onclick="editProduct('+p.id+')">Editar</button><button class="icon-btn" onclick="deleteProduct('+p.id+')">Excluir</button></div></td></tr>').join('')}
function render(){
const totalStock=products.reduce((a,p)=>a+Number(p.stock),0),low=products.filter(p=>p.stock<=5).length,revenue=sales.reduce((a,s)=>a+s.total,0);
if(page==='inicio'){$('#content').innerHTML=head('PAINEL DE CONTROLE','Visão geral','Acompanhe os principais números do seu negócio.')+
'<div class="stats">'+stat('Produtos cadastrados',products.length,'Itens no catálogo','▣')+stat('Unidades em estoque',totalStock,'Quantidade disponível','▤')+stat('Vendas registradas',sales.length,'Operações realizadas','↗')+stat('Faturamento registrado',money(revenue),'Total das vendas','R$')+'</div>'+
'<div class="dashboard-grid"><div><div class="panel"><div class="panel-head"><h2>Acesso rápido</h2><span class="muted">Atalhos do sistema</span></div><div class="quick"><button onclick="openProduct()"><span>＋</span>Novo produto</button><button onclick="go(\'vendas\')"><span>↗</span>Registrar venda</button><button onclick="go(\'estoque\')"><span>▤</span>Ver estoque</button></div></div><div class="panel"><div class="panel-head"><h2>Produtos recentes</h2><button class="btn secondary" onclick="go(\'produtos\')">Ver todos</button></div>'+table(['Produto','Preço','Qtd.','Status','Ações'],productRows(products.slice(-5).reverse()),'Nenhum produto cadastrado ainda.')+'</div></div><div><div class="panel"><div class="panel-head"><h2>Alertas de estoque</h2><span class="pill '+(low?'low':'ok')+'">'+low+' alerta(s)</span></div>'+(low?'<div class="activity">'+products.filter(p=>p.stock<=5).map(p=>'<div class="activity-item"><span class="dot" style="background:#d99a35"></span><div><strong>'+esc(p.name)+' — '+p.stock+' unidade(s)</strong><small>Considere repor este produto</small></div></div>').join('')+'</div>':'<div class="empty">Tudo certo! Nenhum estoque baixo.</div>')+'</div><div class="panel"><div class="panel-head"><h2>Últimas vendas</h2></div><div class="activity">'+(sales.slice(-4).reverse().map(s=>'<div class="activity-item"><span class="dot"></span><div><strong>'+esc(s.product)+' — '+money(s.total)+'</strong><small>'+esc(s.date)+'</small></div></div>').join('')||'<div class="empty">Nenhuma venda registrada.</div>')+'</div></div></div></div>'}
if(page==='produtos'){$('#content').innerHTML=head('CATÁLOGO','Produtos','Cadastre, consulte e mantenha seus produtos organizados.','<button class="btn primary" onclick="openProduct()">＋ Novo produto</button>')+'<div class="panel"><div class="toolbar"><input id="searchProducts" placeholder="Buscar produto por nome ou categoria..."><select id="filterProducts"><option value="todos">Todos os produtos</option><option value="baixo">Estoque baixo</option></select></div><div id="productTable">'+table(['Produto','Preço','Quantidade','Situação','Ações'],productRows(products),'Seu catálogo está vazio. Clique em “Novo produto” para começar.')+'</div></div>';$('#searchProducts').oninput=filterProducts;$('#filterProducts').onchange=filterProducts}
if(page==='estoque'){$('#content').innerHTML=head('CONTROLE','Estoque','Visualize quantidades disponíveis e identifique reposições necessárias.')+'<div class="stats">'+stat('Itens monitorados',products.length,'Produtos diferentes','▣')+stat('Unidades totais',totalStock,'Em estoque','▤')+stat('Precisam de reposição',low,'Até 5 unidades','!')+stat('Sem estoque',products.filter(p=>p.stock===0).length,'Quantidade zerada','×')+'</div><div class="panel"><div class="panel-head"><h2>Posição do estoque</h2><span class="muted">Alerta quando há 5 unidades ou menos</span></div>'+table(['Produto','Categoria','Quantidade','Status','Ação'],products.map(p=>'<tr><td><strong>'+esc(p.name)+'</strong></td><td>'+esc(p.category||'—')+'</td><td><strong>'+p.stock+'</strong></td><td><span class="pill '+(p.stock<=5?'low':'ok')+'">'+(p.stock===0?'Sem estoque':p.stock<=5?'Estoque baixo':'Normal')+'</span></td><td><button class="icon-btn" onclick="editProduct('+p.id+')">Atualizar</button></td></tr>').join(''),'Nenhum produto para monitorar.')+'</div>'}
if(page==='vendas'){$('#content').innerHTML=head('COMERCIAL','Vendas','Registre saídas de produtos e acompanhe o faturamento.','<button class="btn primary" onclick="openSale()">＋ Registrar venda</button>')+'<div class="stats">'+stat('Vendas realizadas',sales.length,'Registros','↗')+stat('Faturamento',money(revenue),'Valor acumulado','R$')+stat('Ticket médio',money(sales.length?revenue/sales.length:0),'Por venda','◈')+stat('Produtos no catálogo',products.length,'Disponíveis para venda','▣')+'</div><div class="panel"><div class="panel-head"><h2>Histórico de vendas</h2></div>'+table(['Produto','Quantidade','Valor total','Data'],sales.slice().reverse().map(s=>'<tr><td><strong>'+esc(s.product)+'</strong></td><td>'+s.qty+'</td><td>'+money(s.total)+'</td><td>'+esc(s.date)+'</td></tr>').join(''),'As vendas registradas aparecerão aqui.')+'</div>'}
if(page==='pedidos'){$('#content').innerHTML=head('OPERAÇÃO','Pedidos','Organize os pedidos recebidos e acompanhe seu andamento.','<button class="btn primary" onclick="openOrder()">＋ Novo pedido</button>')+'<div class="panel"><div class="panel-head"><h2>Lista de pedidos</h2></div>'+table(['Cliente','Descrição','Valor','Data','Status','Ação'],orders.slice().reverse().map(o=>'<tr><td><strong>'+esc(o.client)+'</strong></td><td>'+esc(o.description)+'</td><td>'+money(o.value)+'</td><td>'+esc(o.date)+'</td><td><span class="pill '+(o.status==='Concluído'?'ok':'low')+'">'+esc(o.status)+'</span></td><td><button class="icon-btn" onclick="toggleOrder('+o.id+')">Atualizar status</button></td></tr>').join(''),'Nenhum pedido cadastrado.')+'</div>'}
if(page==='relatorios'){$('#content').innerHTML=head('ANÁLISE','Relatórios','Indicadores simples para apoiar suas decisões comerciais.')+'<div class="stats">'+stat('Faturamento total',money(revenue),'Vendas registradas','R$')+stat('Total de vendas',sales.length,'Transações','↗')+stat('Produtos cadastrados',products.length,'No catálogo','▣')+stat('Estoque baixo',low,'Itens para repor','!')+'</div><div class="panel"><div class="panel-head"><h2>Resumo de produtos</h2></div>'+table(['Produto','Preço unitário','Estoque','Valor em estoque'],products.map(p=>'<tr><td><strong>'+esc(p.name)+'</strong></td><td>'+money(p.price)+'</td><td>'+p.stock+'</td><td>'+money(p.price*p.stock)+'</td></tr>').join(''),'Cadastre produtos para gerar seu relatório.')+'</div><button class="btn secondary" onclick="window.print()">⇩ Imprimir relatório</button>'}
}
function filterProducts(){const q=$('#searchProducts').value.toLowerCase(),f=$('#filterProducts').value;const list=products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q)&&(f==='todos'||p.stock<=5));$('#productTable').innerHTML=table(['Produto','Preço','Quantidade','Situação','Ações'],productRows(list),'Nenhum produto encontrado.')}
function showModal(title,fields,type,id=null){formType=type;editing=id;$('#modalTitle').textContent=title;$('#formFields').innerHTML=fields.map(f=>'<div class="field '+(f.full?'full':'')+'"><label for="'+f.name+'">'+f.label+'</label>'+(f.options?'<select id="'+f.name+'" name="'+f.name+'" required>'+f.options.map(o=>'<option>'+o+'</option>').join('')+'</select>':'<input id="'+f.name+'" name="'+f.name+'" type="'+(f.type||'text')+'" '+(f.step?'step="'+f.step+'"':'')+' '+(f.min!==undefined?'min="'+f.min+'"':'')+' '+(f.required===false?'':'required')+' value="'+esc(f.value??'')+'" placeholder="'+(f.placeholder||'')+'">')+'</div>').join('');$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function openProduct(p=null){showModal(p?'Editar produto':'Novo produto',[{name:'name',label:'Nome do produto',value:p?.name,full:true},{name:'category',label:'Categoria',value:p?.category,required:false},{name:'price',label:'Preço (R$)',type:'number',step:'0.01',min:0,value:p?.price??''},{name:'stock',label:'Quantidade em estoque',type:'number',min:0,value:p?.stock??0}], 'product',p?.id??null)}
function editProduct(id){const p=products.find(x=>x.id===id);if(p)openProduct(p)}
function deleteProduct(id){if(confirm('Deseja excluir este produto?')){products=products.filter(p=>p.id!==id);save('sc_products',products);render()}}
function openSale(){if(!products.length){alert('Cadastre um produto antes de registrar uma venda.');go('produtos');return}showModal('Registrar venda',[{name:'product',label:'Produto',options:products.map(p=>p.name)},{name:'qty',label:'Quantidade',type:'number',min:1,value:1}], 'sale')}
function openOrder(){showModal('Novo pedido',[{name:'client',label:'Nome do cliente'},{name:'description',label:'Descrição do pedido',full:true},{name:'value',label:'Valor (R$)',type:'number',step:'0.01',min:0},{name:'status',label:'Status',options:['Pendente','Em andamento','Concluído']}],'order')}
function toggleOrder(id){const o=orders.find(x=>x.id===id);if(o){o.status=o.status==='Pendente'?'Em andamento':o.status==='Em andamento'?'Concluído':'Pendente';save('sc_orders',orders);render()}}
$('#itemForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(formType==='product'){const item={id:editing??Date.now(),name:d.name,category:d.category,price:Number(d.price),stock:Number(d.stock)};if(editing)products=products.map(p=>p.id===editing?item:p);else products.push(item);save('sc_products',products);closeModal();render();return}
if(formType==='sale'){const p=products.find(x=>x.name===d.product),qty=Number(d.qty);if(!p||qty<1||qty>p.stock){alert('Quantidade inválida ou estoque insuficiente.');return}p.stock-=qty;sales.push({id:Date.now(),product:p.name,qty,total:qty*p.price,date:date()});save('sc_products',products);save('sc_sales',sales)}
if(formType==='order'){orders.push({id:Date.now(),...d,value:Number(d.value),date:date()});save('sc_orders',orders)}
closeModal();render()};
$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};$('#nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
let fontScale=1;
function applyFontScale(){document.body.style.zoom=fontScale;$('#fontDown').disabled=fontScale<=1;$('#fontUp').disabled=fontScale>=1.25}
$('#fontDown').onclick=()=>{fontScale=Math.max(1,fontScale-0.1);applyFontScale()};
$('#fontUp').onclick=()=>{fontScale=Math.min(1.25,fontScale+0.1);applyFontScale()};
$('#contrastToggle').onclick=()=>{const enabled=document.body.classList.toggle('high-contrast');$('#contrastToggle').setAttribute('aria-pressed',String(enabled));$('#contrastToggle').textContent=enabled?'Contraste normal':'Alto contraste'};
applyFontScale();
render();
</script>
</body></html>
